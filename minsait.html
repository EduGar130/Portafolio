<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="img/ico/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/experience-detail.css">

<body data-company="minsait">

        <h1 id="detail-role">Ingeniero de software</h1>

        <span id="detail-company">Minsait</span>
        <span id="detail-period">ene. 2024 - actualidad</span>

    <section class="grid">

        <h2 id="achievements-title">Impacto y logros</h2>
        <ul id="achievements-list"></ul>
      </article>
      <article class="panel">

    <section class="panel">
